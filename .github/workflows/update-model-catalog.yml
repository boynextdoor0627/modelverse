name: Update model catalog

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: model-catalog-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh public model sources
        run: node scripts/update-model-catalog.mjs
      - name: Commit catalog changes
        run: |
          if git diff --quiet -- public/models.json data/catalog-report.json; then
            echo "Catalog already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models.json data/catalog-report.json data/official-model-registry.json public/official-model-registry.json
          git commit -m "Update model catalog"
          git push
